<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        //Initiaize Map
        var map = L.map('map').setView([-8.0849551, 112.1669930], 15);

        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        var OpenTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        });

        // Menambahkan basemap ke dalam peta
        Esri_WorldImagery.addTo(map);

        // Marker
        var marker = L.marker([-8.0849551, 112.1669930]);
        var marker2 = L.marker([-8.0693884, 111.9026184]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);

        // Popup
        marker.bindPopup("Kota Blitar adalah sebuah kota di Provinsi Jawa Timur yang dikenal sebagai tempat disemayamkannya Presiden pertama Indonesia, Ir. Soekarno");
        marker2.bindPopup("Tulungagung terletak pada ketinggian 85 m di atas permukaan laut (dpl). Bagian barat laut Kabupaten Tulungagung merupakan daerah pegunungan yang merupakan bagian dari pegunungan Wilis-Liman. Bagian tengah adalah dataran rendah, sedangkan bagian selatan adalah pegunungan yang merupakan rangkaian dari Pegunungan Kidul.");

        // Tooltip
        marker.bindTooltip("Kota Blitar");
        marker2.bindTooltip("Kabupaten Tulungagung");

        // Circle
        var circle = L.circle([-7.954688923614317, 112.61214091543934], {
            color: "blue", // warna garis
            opacity: 1, // opacity garis
            fillColor: "yellow", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 1000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindPopup("<b>Hai</b><br>Ini adalah popup circle radius 1 km");
        circle.bindTooltip("Ini Circle", { sticky: true });

        // Polyline
        var vertexPolyline = [
            [-7.954688923614317, 112.61214091543934],
            [-8.0849551, 112.1669930],
            [-8.0693884, 111.9026184],
            [-7.774842365900411, 110.3745387111008],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 2, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        //POP UP TOOLTIP
        polyline.bindPopup("<b>Hai</b><br>Ini adalah popup polyline");
        polyline.bindTooltip("Ini Polyline", { sticky: true });

        // Polygon
        var vertexPolygon = [
            [-7.954688923614317, 112.61214091543934],
            [-8.0849551, 112.1669930],
            [-8.0693884, 111.9026184],
            [-7.954688923614317, 112.61214091543934]
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        //POP UP TOOLTIP
        polygon.bindPopup("<b>Hai</b><br>Ini adalah popup polygon");
        polygon.bindTooltip("Ini polygon", { sticky: true });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "OpenTopoMap": OpenTopoMap,

        };

        var overlayMaps = {
            "Kota Blitar": marker,
            "Tulungagung": marker2,
            "Circle": circle,
            "Line": polyline,
            "Polygon": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale();
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);

    </script>
</body>

</html>
